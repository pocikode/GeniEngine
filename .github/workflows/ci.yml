name: CI

# Every pushed branch is built, so a branch is checked before it has a pull request.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            workflow: dev
          - name: Linux
            os: ubuntu-24.04
            workflow: dev
          # Hosted Windows runners have no OpenGL 3.3 driver, so the tests that need a
          # window are skipped there. They still compile, and the sample is still built.
          - name: Windows
            os: windows-2025
            workflow: dev-no-gpu

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install glfw glew

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglfw3-dev libglew-dev libgl1-mesa-dev libgl1-mesa-dri xvfb

      # GLFW and GLEW come from vcpkg.json; CMakeLists.txt picks the toolchain up
      # from VCPKG_ROOT.
      - name: Point VCPKG_ROOT at the preinstalled vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configure, build and test (Linux)
        if: runner.os == 'Linux'
        env:
          # Software OpenGL, so the result does not depend on the runner's hardware.
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24" cmake --workflow --preset ${{ matrix.workflow }}

      - name: Configure, build and test (macOS, Windows)
        if: runner.os != 'Linux'
        run: cmake --workflow --preset ${{ matrix.workflow }}

      - name: Upload logs and crash reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.name }}
          path: |
            build/dev/Testing/Temporary/LastTest.log
            build/dev/**/geni_crash_*.log
          if-no-files-found: ignore
