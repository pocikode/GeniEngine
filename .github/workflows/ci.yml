name: CI

# Every pushed branch is built, so a branch is checked before it has a pull request.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04
          # Hosted Windows runners have no Vulkan driver, so the tests that need a window
          # are skipped there. They still compile, and the sample is still built.
          - name: Windows
            os: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # The pinned Slang compiler (cmake/GeniShaders.cmake) is downloaded on configure;
      # caching it saves the download on every run.
      - name: Cache the Slang compiler
        uses: actions/cache@v4
        with:
          path: .cache/slang
          key: slang-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/GeniShaders.cmake') }}

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install glfw molten-vk vulkan-headers vulkan-loader vulkan-validationlayers vulkan-tools

      # lavapipe (mesa-vulkan-drivers) is a software Vulkan driver, so the result does
      # not depend on the runner's hardware.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglfw3-dev libvulkan-dev vulkan-validationlayers vulkan-tools \
            mesa-vulkan-drivers xvfb

      # Headers and loader come from the LunarG Vulkan SDK; GLFW comes
      # from vcpkg.json, which CMakeLists.txt picks up from VCPKG_ROOT.
      - name: Install the Vulkan SDK and point VCPKG_ROOT at vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Invoke-WebRequest -UseBasicParsing https://vulkan.lunarg.com/sdk/latest/windows.txt).Content.Trim()
          Write-Host "Vulkan SDK $version"
          $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Invoke-WebRequest -UseBasicParsing "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan-sdk.exe" -OutFile $installer
          $root = "C:\VulkanSDK\$version"
          Start-Process -Wait -FilePath $installer -ArgumentList "--root", $root, "--accept-licenses", "--default-answer", "--confirm-command", "install"
          echo "VULKAN_SDK=$root" >> $env:GITHUB_ENV
          echo "$root\Bin" >> $env:GITHUB_PATH
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # Runs the full workflow when the runner has a Vulkan device, and the one without
      # gpu tests otherwise, with a visible warning rather than a silent skip.
      - name: Choose the workflow preset
        shell: bash
        run: |
          probe="vulkaninfo --summary"
          if [ "$RUNNER_OS" = "Linux" ]; then probe="xvfb-run -a $probe"; fi
          if [ "$RUNNER_OS" != "Windows" ] && $probe 2>/dev/null | grep -q "deviceName"; then
            $probe 2>/dev/null | grep -E "deviceName|driverName|apiVersion" || true
            echo "GENI_PRESET=dev" >> "$GITHUB_ENV"
          else
            if [ "$RUNNER_OS" != "Windows" ]; then
              echo "::warning::No Vulkan device on this runner; gpu and screenshot tests are skipped"
            fi
            echo "GENI_PRESET=dev-no-gpu" >> "$GITHUB_ENV"
          fi

      - name: Configure, build and test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x720x24" cmake --workflow --preset ${{ env.GENI_PRESET }}

      - name: Configure, build and test (macOS, Windows)
        if: runner.os != 'Linux'
        run: cmake --workflow --preset ${{ env.GENI_PRESET }}

      # The cooker writes KTX2 by hand (tools/asset_cooker/Ktx2Writer.cpp); Khronos's own
      # validator checks every cooked file against the specification.
      - name: Validate cooked KTX2 files (Linux)
        if: runner.os == 'Linux'
        run: |
          version=4.4.2
          sha1=c6b08c817f8c8dd299deccae4f2fbb8d55e9acd2
          archive=KTX-Software-$version-Linux-x86_64.tar.bz2
          curl -sfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/KhronosGroup/KTX-Software/releases/download/v$version/$archive"
          echo "$sha1  $RUNNER_TEMP/$archive" | sha1sum -c -
          tar xjf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          ktx_root="$RUNNER_TEMP/KTX-Software-$version-Linux-x86_64"
          status=0
          while IFS= read -r -d '' file; do
            LD_LIBRARY_PATH="$ktx_root/lib" "$ktx_root/bin/ktx" validate "$file" || { echo "::error file=$file::ktx validate failed"; status=1; }
          done < <(find build/dev -name '*.ktx2' -print0)
          exit $status

      - name: Upload logs, crash reports and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.name }}
          path: |
            build/dev/Testing/Temporary/LastTest.log
            build/dev/**/geni_crash_*.log
            build/dev/screenshots/*.png
          if-no-files-found: ignore
